kind = "web"
previewPath = "/"
title = "MasonPowers Mail"
version = "1.0.0"
id = "artifacts/mail"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20126

[services.development]
run = "pnpm --filter @workspace/mail run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mail", "run", "build" ]
publicDir = "artifacts/mail/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20126"
BASE_PATH = "/"
