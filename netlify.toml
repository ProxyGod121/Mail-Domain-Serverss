[build]
  base = "."
  command = "pnpm --filter @workspace/mail run build"
  publish = "artifacts/mail/dist/public"

[build.environment]
  BASE_PATH = "/"
  NODE_ENV = "production"

# Proxy all /api/* calls to your Render API service.
# Replace YOUR_RENDER_API_URL after you deploy the API to Render.
# e.g. https://masonpowers-api.onrender.com
[[redirects]]
  from = "/api/*"
  to = "YOUR_RENDER_API_URL/api/:splat"
  status = 200
  force = true

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
